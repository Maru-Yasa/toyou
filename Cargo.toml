[package]
name = "toyou"
version = "0.1.0"
edition = "2024"
default-run = "toyou"

[dependencies]
gpui-kit = "0.7.1"
flume = "0.12"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha1_smol = "1"
wry = "0.57"
tao = "0.37.1"
rodio = { version = "0.22", default-features = false, features = ["playback", "mp4"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
